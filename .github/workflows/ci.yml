name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit + API tests
        run: npm test

      - name: Render smoke test (all routes)
        run: npm run smoke

      - name: Build (server + web)
        run: npm run build

      - name: Smoke test packaged API
        run: |
          node --experimental-sqlite --no-warnings=ExperimentalWarning server/dist/db/seed.js
          node --experimental-sqlite --no-warnings=ExperimentalWarning server/dist/index.js &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8787/api/health > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8787/api/health | tee /dev/stderr | grep -q '"status":"ok"'
          curl -sf http://127.0.0.1:8787/ | grep -q '<div id="root">'
          kill $SERVER_PID
